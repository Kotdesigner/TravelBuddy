<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalender: Termine vs. Logbuch-Abdeckung</title>
<style>body{font:13px -apple-system,sans-serif;margin:0;padding:8px;background:#faf7f2}
#log{white-space:pre-wrap;font:11.5px ui-monospace,monospace;background:#fff;border:1px solid #ddd;padding:8px;border-radius:8px}
.ok{color:#1a7f37}.bad{color:#c62828;font-weight:700} iframe{width:420px;height:160px;border:1px solid #ccc}</style>
<div id="log">…</div>
<script>
localStorage.setItem('standort-schon-gefragt','1')
const f=document.createElement('iframe'); f.src='./index.html'; document.body.appendChild(f)
const L=document.getElementById('log'); let z=[]
const zeig=()=>L.innerHTML=z.map(x=>`<div class="${x[0]==='✅'?'ok':x[0]==='❌'?'bad':''}">${x}</div>`).join('')
const p=(t,ok)=>{ z.push((ok===true?'✅ ':ok===false?'❌ ':'   ')+t); zeig() }
const w8=ms=>new Promise(r=>setTimeout(r,ms))
const bis=async(fn,ms=45000)=>{const t=Date.now();while(Date.now()-t<ms){try{const v=fn();if(v)return v}catch{}await w8(300)}return null}
const klick=el=>{for(const t of ['pointerdown','mousedown','pointerup','mouseup','click'])
  el.dispatchEvent(new MouseEvent(t,{bubbles:true,cancelable:true,view:el.ownerDocument.defaultView}))}
const setzeWert=(el,v)=>{ el.value=v
  el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})) }

f.onload=async()=>{
  const w=f.contentWindow, d=f.contentDocument
  const fehler=[]
  w.addEventListener('error',e=>fehler.push((e.message||'')+' @'+(e.lineno||'')))
  w.addEventListener('unhandledrejection',e=>fehler.push('Promise: '+(e.reason?.message||e.reason)))
  const ce=w.console.error; w.console.error=(...a)=>{fehler.push('console: '+a.map(x=>String(x?.message||x)).join(' ').slice(0,100)); ce.apply(w.console,a)}
  try{ Object.defineProperty(w.navigator,'geolocation',{get:()=>undefined}) }catch{}
  w.confirm = () => true

  if(!await bis(()=>d.querySelector('nav.bar'))){p('ABBRUCH',false);return}
  await w8(4500)

  const planStart = d.querySelector('#kalender .start input[type=date]')?.value || ''
  p('Plan-Start: '+planStart, !!planStart)
  const etappen = d.querySelectorAll('#kalender .gruppe')
  p('Etappen im Plan: '+etappen.length, etappen.length>0)

  // --- Logbuchtag INNERHALB des Plans anlegen
  const jVorher = d.querySelectorAll('#tagebuch .je').length
  klick(d.querySelector('#tagebuch .neu')); await w8(1100)
  const je = d.querySelector('#tagebuch .je:not(.zu)')
  if(je){
    setzeWert(je.querySelector('input.datum'), planStart); await w8(900)
    setzeWert(je.querySelector('input.ort'), 'TESTTAG'); await w8(700)
  }
  p('Logbuchtag auf '+planStart+' angelegt', !!je)

  // --- Wanderung mit demselben Datum
  const wVorher = d.querySelectorAll('#wanderungen .card').length
  klick(d.querySelector('#wanderungen .neu')); await w8(900)
  const karte = d.querySelector('#wanderungen .card.offen')
  if(karte){
    setzeWert(karte.querySelector('input[type=date]'), planStart); await w8(800)
    setzeWert(karte.querySelector('.c-name'), 'TEST-Wanderung'); await w8(600)
  }
  p('Wanderung auf '+planStart+' angelegt', !!karte)
  await w8(900)

  // --- Der eigentliche Test
  const dokuZeilen = [...d.querySelectorAll('#kalender .doku')]
  p('Abdeckungs-Zeile im Kalender: '+dokuZeilen.length, dokuZeilen.length>=1)
  if(dokuZeilen.length) p('   „'+dokuZeilen[0].textContent.replace(/\s+/g,' ').trim()+'"',
    /von .* im Logbuch/.test(dokuZeilen[0].textContent))

  const einzelLogbuch = d.querySelectorAll('#kalender .termin.logbuch')
  p('KEINE Logbuch-Einzelzeilen mehr im Plan ('+einzelLogbuch.length+')', einzelLogbuch.length===0)

  const wTermin = [...d.querySelectorAll('#kalender .termin.wanderung')]
  p('Wanderung steht weiterhin als Termin ('+wTermin.length+')', wTermin.length>=1)
  if(wTermin.length) p('   „'+wTermin[0].textContent.replace(/\s+/g,' ').trim().slice(0,64)+'"', /🥾/.test(wTermin[0].textContent))

  const a = d.querySelector('#kalender .ausserhalb .a-titel')
  p('„außerhalb"-Kopfzeile: '+(a?a.textContent.replace(/\s+/g,' ').trim():'— keiner —'),
    !a || /Logbuchtag|Termin/.test(a.textContent))

  // --- Aufräumen
  const wWeg=[...d.querySelectorAll('#wanderungen .card')].find(c=>/TEST-Wanderung/.test(c.querySelector('.c-name')?.value||''))
  if(wWeg){ klick(wWeg.querySelector('.c-del')); await w8(700) }
  // Achtung: der Ortsname steht in einem <input> — dessen Wert taucht NICHT in
  // textContent auf. Nur die zugeklappte Zeile zeigt ihn als Text.
  const istTest=(x)=>x.querySelector('input.ort')?.value==='TESTTAG' || /TESTTAG/.test(x.textContent)
  for(let n=0;n<5;n++){
    const jWeg=[...d.querySelectorAll('#tagebuch .je')].find(istTest)
    if(!jWeg) break
    let del=jWeg.querySelector('.del')
    if(!del){ klick(jWeg.querySelector('.je-kurz')); await w8(600); del=jWeg.querySelector('.del') }
    if(del) klick(del); else break
    await w8(700)
  }
  p('aufgeräumt: '+d.querySelectorAll('#wanderungen .card').length+'/'+wVorher+' Wanderungen · '
    +d.querySelectorAll('#tagebuch .je').length+'/'+jVorher+' Reisetage',
    d.querySelectorAll('#wanderungen .card').length===wVorher && d.querySelectorAll('#tagebuch .je').length===jVorher)

  const schlecht=z.filter(x=>x[0]==='❌')
  z.unshift('JS-FEHLER ('+fehler.length+')')
  fehler.slice(0,3).forEach((x,i)=>z.splice(1+i,0,'  ⤷ '+String(x).slice(0,100)))
  schlecht.forEach((x,i)=>z.splice(i,0,x))
  z.push('———— '+((schlecht.length||fehler.length)?(schlecht.length+' FEHLER, '+fehler.length+' JS'):'ALLES OK')+' ————')
  zeig(); f.style.display='none'
}
</script>
