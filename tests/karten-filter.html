<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Routen- und Orte-Filter</title>
<style>body{font:13px -apple-system,sans-serif;margin:0;padding:8px;background:#faf7f2}
#log{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#fff;border:1px solid #ddd;padding:8px;border-radius:8px}
.ok{color:#1a7f37}.bad{color:#c62828;font-weight:700} iframe{width:420px;height:260px;border:1px solid #ccc}</style>
<div id="log">…</div>
<script>
localStorage.setItem('standort-schon-gefragt','1')
const f=document.createElement('iframe'); f.src='./index.html'; document.body.appendChild(f)
const L=document.getElementById('log'); let z=[]
const zeig=()=>L.innerHTML=z.map(x=>`<div class="${x[0]==='✅'?'ok':x[0]==='❌'?'bad':''}">${x}</div>`).join('')
const p=(t,ok)=>{ z.push((ok===true?'✅ ':ok===false?'❌ ':'   ')+t); zeig() }
const w8=ms=>new Promise(r=>setTimeout(r,ms))
const bis=async(fn,ms=60000)=>{const t=Date.now();while(Date.now()-t<ms){try{const v=fn();if(v)return v}catch{}await w8(400)}return null}
const klick=el=>{for(const t of ['pointerdown','mousedown','pointerup','mouseup','click'])
  el.dispatchEvent(new MouseEvent(t,{bubbles:true,cancelable:true,view:el.ownerDocument.defaultView}))}
f.onload=async()=>{
  const w=f.contentWindow, d=f.contentDocument
  const fehler=[]
  w.addEventListener('error',e=>fehler.push((e.message||'')+' @'+(e.filename||'').split('/').pop()+':'+e.lineno))
  w.addEventListener('unhandledrejection',e=>fehler.push('Promise: '+(e.reason?.message||e.reason)))
  const ce=w.console.error; w.console.error=(...a)=>{fehler.push('console: '+a.map(x=>String(x?.message||x)).join(' ').slice(0,120)); ce.apply(w.console,a)}
  try{ Object.defineProperty(w.navigator,'geolocation',{get:()=>undefined}) }catch{}
  if(!await bis(()=>d.querySelector('nav.bar'))){p('ABBRUCH',false);return}
  await w8(5000)

  // ---- Übersichtskarte ----
  const leg=()=>[...d.querySelectorAll('.rk-legende .rk-leg')]
  p('Legende: '+leg().length+' Knöpfe — '+leg().map(b=>b.textContent.trim().slice(0,16)).join(' | '), leg().length>=3)
  const alle=leg().find(b=>b.textContent.trim()==='Alle')
  const keine=leg().find(b=>b.textContent.trim()==='Keine')
  p('   „Alle" und „Keine" da', !!alle && !!keine)
  const routen=()=>leg().filter(b=>!['Alle','Keine'].includes(b.textContent.trim()))
  const anRk=()=>routen().filter(b=>b.classList.contains('an')).length
  p('   anfangs alle sichtbar: '+anRk()+'/'+routen().length, anRk()===routen().length)
  klick(routen()[0]); await w8(900)
  p('   eine ausblenden: '+anRk()+'/'+routen().length, anRk()===routen().length-1)
  klick(keine); await w8(900)
  p('   „Keine": '+anRk(), anRk()===0)
  klick(alle); await w8(900)
  p('   „Alle": '+anRk()+'/'+routen().length, anRk()===routen().length)

  // ---- Offline-Karte: Orte-Schalter ----
  const nav=[...d.querySelectorAll('a,button')].find(x=>/Offline-Karten & Regionen/.test(x.textContent))
  if(nav) nav.click()
  await bis(()=>d.querySelector('.karten canvas')); await w8(6500)
  const orteBtn=[...d.querySelectorAll('.poi-bar .poi-chip')].find(b=>/📍 Orte/.test(b.textContent))
  p('Knopf „📍 Orte" in der Zeigen-Leiste', !!orteBtn)
  const pins=()=>d.querySelectorAll('.karten .pin').length
  const besucht=()=>d.querySelectorAll('.karten .pin.besucht').length
  const vorher=pins()
  p('   Pins sichtbar: '+vorher+' · davon besucht: '+besucht(), vorher>0)
  if(orteBtn){
    klick(orteBtn); await w8(1600)
    const nachher=pins()
    p('   ausgeblendet: '+nachher+' Pins übrig (nur besuchte)', nachher<vorher)
    p('   alle übrigen sind besuchte: '+besucht()+'/'+nachher, nachher===besucht())
    p('   Beschriftung: '+orteBtn.textContent.replace(/\s+/g,' ').trim(), /Orte/.test(orteBtn.textContent))
    klick(orteBtn); await w8(1600)
    p('   wieder eingeblendet: '+pins()+'/'+vorher, pins()===vorher)
  }

  z.unshift('JS-FEHLER ('+fehler.length+'):')
  fehler.slice(0,3).forEach((x,i)=>z.splice(1+i,0,'  ⤷ '+String(x).slice(0,110)))
  const bad=z.filter(x=>x[0]==='❌').length
  z.push('———— '+(bad||fehler.length?(bad+' FEHLER, '+fehler.length+' JS'):'ALLES OK')+' ————')
  zeig(); f.style.display='none'
}
</script>
