<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vacation-Orte — Ansicht</title>
<style>html,body{margin:0;height:100%;background:#111}iframe{width:100vw;height:100vh;border:0;display:block}</style>
<iframe id="f" src="./index.html"></iframe>
<script>
const warte=ms=>new Promise(r=>setTimeout(r,ms))
const klick=el=>{for(const t of ['pointerdown','mousedown','pointerup','mouseup','click'])
  el.dispatchEvent(new MouseEvent(t,{bubbles:true,cancelable:true,view:el.ownerDocument.defaultView}))}
async function bis(fn,ms,st=600){const t0=Date.now();while(Date.now()-t0<ms){try{const v=fn();if(v)return v}catch{}await warte(st)}return null}
document.getElementById('f').onload=async()=>{
  const d=document.getElementById('f').contentDocument
  await bis(()=>d.querySelector('#urlaub-orte'),30000)
  await warte(1500)
  d.querySelector('#urlaub-orte').scrollIntoView()
  const voll=await bis(()=>[...d.querySelectorAll('#urlaub-orte .btn')].find(b=>b.textContent.includes('vervollständigen')),8000)
  if(voll) klick(voll)
  await bis(()=>{const k=[...d.querySelectorAll('#urlaub-orte .uo-card .card')]
    return k.length && k.every(c=>c.querySelector('.img img'))},170000,2000)
  await warte(2500)
  d.querySelector('#urlaub-orte .uo-card')?.scrollIntoView({block:'start'})
}
</script>
